apis:
- aid: arbitrum:one-rpc
  name: Arbitrum One JSON-RPC
  description: >-
    Public Ethereum JSON-RPC endpoint for Arbitrum One mainnet (chain ID 42161), the flagship optimistic
    rollup secured directly by Ethereum L1. Supports standard eth_* methods plus Arbitrum-specific precompiles
    for L1 messaging, retryable tickets, and gas accounting. Public endpoint does not support WebSockets
    — production teams use Alchemy, QuickNode, Infura, Chainstack, or self-hosted Nitro nodes.
  humanURL: https://docs.arbitrum.io/build-decentralized-apps/reference/node-providers
  baseURL: https://arb1.arbitrum.io/rpc
